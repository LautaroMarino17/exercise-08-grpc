services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: noderegistry
      POSTGRES_PASSWORD: noderegistry
      POSTGRES_DB: noderegistry
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noderegistry"]
      interval: 5s
      timeout: 5s
      retries: 5

  grpc-server:
    build:
      context: .
      dockerfile: grpc_server/Dockerfile
    environment:
      DATABASE_URL: postgresql://noderegistry:noderegistry@db:5432/noderegistry
    ports:
      - "50051:50051"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.connect(('localhost',50051)); s.close()"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    environment:
      GRPC_HOST: grpc-server:50051
    ports:
      - "8080:8080"
    depends_on:
      grpc-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  pgdata:
