services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: noderegistry
      POSTGRES_PASSWORD: noderegistry
      POSTGRES_DB: noderegistry

  grpc-server:
    build:
      context: .
      dockerfile: grpc_server/Dockerfile
    ports:
      - "50051:50051"
    depends_on:
      - db

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - grpc-server
