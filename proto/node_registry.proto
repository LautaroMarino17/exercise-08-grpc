syntax = "proto3";

package node_registry;

service NodeRegistryService {
  rpc RegisterNode (NodeRequest) returns (NodeResponse);
  rpc GetNodes (Empty) returns (NodeList);
  rpc DeleteNode (NodeRequest) returns (NodeResponse);
}

message Empty {}

message NodeRequest {
  string name = 1;
  string ip = 2;
}

message NodeResponse {
  string message = 1;
}

message Node {
  string name = 1;
  string ip = 2;
}

message NodeList {
  repeated Node nodes = 1;
}
